<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Mohammed Hashid</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 30px;
        }

        .refresh-btn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
        }

        .stat-card h3 {
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
        }

        .table-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #93c5fd;
        }

        td {
            color: #e2e8f0;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <header>

            <h1>📊 Admin Dashboard</h1>

            <button
                class="refresh-btn"
                onclick="loadMessages()">
                🔄 Refresh
            </button>

        </header>


        <div class="stats">

            <div class="stat-card">

                <h3>Total Messages</h3>

                <p id="totalMessages">0</p>

            </div>


            <div class="stat-card">

                <h3>Latest Sender</h3>

                <p id="latestSender">-</p>

            </div>


            <div class="stat-card">

                <h3>Status</h3>

                <p>🟢 Online</p>

            </div>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Subject</th>

                        <th>Message</th>

                        <th>Date</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="messagesTable">

                </tbody>

            </table>


            <div
                id="emptyMessage"
                class="empty"
                style="display: none;">

                📭 No messages yet.

            </div>

        </div>

    </div>


    <script>

        async function loadMessages() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/messages"
                );

                const data = await response.json();

                const table =
                    document.getElementById("messagesTable");

                const emptyMessage =
                    document.getElementById("emptyMessage");

                const totalMessages =
                    document.getElementById("totalMessages");

                const latestSender =
                    document.getElementById("latestSender");


                table.innerHTML = "";


                if (!data.success) {

                    emptyMessage.style.display = "block";

                    emptyMessage.textContent =
                        "❌ Failed to load messages.";

                    return;

                }


                totalMessages.textContent =
                    data.count;


                if (data.count === 0) {

                    emptyMessage.style.display = "block";

                    latestSender.textContent = "-";

                    return;

                }


                emptyMessage.style.display = "none";


                latestSender.textContent =
                    data.messages[0].name;


                data.messages.forEach(function(message) {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>${message.id}</td>

                        <td>${message.name}</td>

                        <td>${message.email}</td>

                        <td>${message.subject || "-"}</td>

                        <td>${message.message}</td>

                        <td>${message.created_at}</td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteMessage(${message.id})">

                                Delete

                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                });

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "emptyMessage"
                ).style.display = "block";

                document.getElementById(
                    "emptyMessage"
                ).textContent =
                    "❌ Backend server is not running.";

            }

        }


        async function deleteMessage(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this message?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response = await fetch(
                    `http://localhost:5000/api/messages/${id}`,
                    {
                        method: "DELETE"
                    }
                );


                const data =
                    await response.json();


                if (data.success) {

                    alert("Message deleted successfully! ✅");

                    loadMessages();

                } else {

                    alert(
                        data.message ||
                        "Failed to delete message."
                    );

                }

            } catch (error) {

                console.error(error);

                alert(
                    "Backend server is not running."
                );

            }

        }


        // Load messages when page opens
        loadMessages();

    </script>

</body>

</html>
